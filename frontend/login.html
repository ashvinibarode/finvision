<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FinVision - Login</title>

    <link rel="stylesheet" href="css/auth.css">
</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <h1>FinVision</h1>

        <p class="subtitle">
            Login to manage your finances
        </p>

        <form id="loginForm">

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                        type="email"
                        id="email"
                        required
                >

            </div>

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                        type="password"
                        id="password"
                        required
                >

            </div>

            <button type="submit">
                Login
            </button>

            <p id="errorMessage"></p>

        </form>

        <p class="switch-auth">
            Don't have an account?
            <a href="register.html">Register</a>
        </p>

    </div>

</div>

<script src="js/auth.js"></script>

</body>

</html>
