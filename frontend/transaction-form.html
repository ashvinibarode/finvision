<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FinVision - Add Transaction</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="dashboard">

    <aside class="sidebar">

        <h2>FinVision</h2>

        <nav>
            <a href="index.html">Dashboard</a>
            <a href="transactions.html">Transactions</a>
            <a href="budget.html">Budgets</a>
            <a href="#">Reports</a>
            <a href="#">Profile</a>
        </nav>

        <button id="logoutBtn">Logout</button>

    </aside>


    <main class="main-content">

        <header class="topbar">

            <div>
                <h1 id="formTitle">
                    Add Transaction
                </h1>

                <p>
                    Record your income or expense
                </p>
            </div>

        </header>


        <section class="transactions-card">

            <form id="transactionForm">

                <div class="form-group">

                    <label for="title">
                        Title
                    </label>

                    <input
                            type="text"
                            id="title"
                            required
                    >

                </div>


                <div class="form-group">

                    <label for="description">
                        Description
                    </label>

                    <textarea
                            id="description"
                            rows="4"
                    ></textarea>

                </div>


                <div class="form-group">

                    <label for="amount">
                        Amount
                    </label>

                    <input
                            type="number"
                            id="amount"
                            min="0.01"
                            step="0.01"
                            required
                    >

                </div>


                <div class="form-group">

                    <label for="category">
                        Category
                    </label>

                    <select
                            id="category"
                            required
                    >
                        <option value="">
                            Select Category
                        </option>
                    </select>

                </div>


                <div class="form-group">

                    <label for="transactionDate">
                        Date
                    </label>

                    <input
                            type="date"
                            id="transactionDate"
                            required
                    >

                </div>


                <button type="submit" id="submitBtn">
                    Save Transaction
                </button>

                <button
                        type="button"
                        id="cancelBtn"
                >
                    Cancel
                </button>

                <p id="formMessage"></p>

            </form>

        </section>

    </main>

</div>

<script src="js/api.js"></script>
<script src="js/transaction-form.js"></script>

</body>

</html>
