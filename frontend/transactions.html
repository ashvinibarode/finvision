<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FinVision - Transactions</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="dashboard">

    <aside class="sidebar">

        <h2>FinVision</h2>

        <nav>
            <a href="index.html">Dashboard</a>
            <a href="transactions.html" class="active">Transactions</a>
            <a href="#">Budgets</a>
            <a href="#">Reports</a>
            <a href="#">Profile</a>
        </nav>

        <button id="logoutBtn">Logout</button>

    </aside>


    <main class="main-content">

        <header class="topbar">

            <div>
                <h1>Transactions</h1>
                <p>Manage your income and expenses</p>
            </div>

            <button id="addTransactionBtn">
                Add Transaction
            </button>

        </header>


        <!-- Filters -->

        <section class="transactions-card">

            <div class="filters">

                <input
                        type="text"
                        id="searchInput"
                        placeholder="Search transactions..."
                >

                <select id="categoryFilter">
                    <option value="">All Categories</option>
                </select>

                <select id="typeFilter">
                    <option value="">All Types</option>
                    <option value="INCOME">Income</option>
                    <option value="EXPENSE">Expense</option>
                </select>

                <button id="filterBtn">
                    Filter
                </button>



            </div>


            <!-- Transaction Table -->

            <table>

                <thead>

                <tr>
                    <th>Title</th>
                    <th>Category</th>
                    <th>Amount</th>
                    <th>Date</th>
                    <th>Action</th>
                </tr>

                </thead>

                <tbody id="transactionTableBody">
                </tbody>

            </table>


            <!-- Pagination -->

            <div class="pagination">

                <button id="previousBtn">
                    Previous
                </button>

                <span id="pageInfo">
                    Page 1
                </span>

                <button id="nextBtn">
                    Next
                </button>

            </div>

        </section>

    </main>

</div>

<script src="js/api.js"></script>
<script src="js/transactions.js"></script>

<script>
    document
        .getElementById("addTransactionBtn")
        .addEventListener("click", () => {

            window.location.href =
                "transaction-form.html";

        });
</script>

</body>

</html>
