<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FinVision - Register</title>

    <link rel="stylesheet" href="css/auth.css">

</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <h1>FinVision</h1>

        <p class="subtitle">
            Create your account
        </p>

        <form id="registerForm">

            <!-- First Name -->

            <div class="form-group">

                <label for="firstName">
                    First Name
                </label>

                <input
                        type="text"
                        id="firstName"
                        required
                >

            </div>


            <!-- Last Name -->

            <div class="form-group">

                <label for="lastName">
                    Last Name
                </label>

                <input
                        type="text"
                        id="lastName"
                        required
                >

            </div>


            <!-- Email -->

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                        type="email"
                        id="email"
                        required
                >

            </div>


            <!-- Password -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                        type="password"
                        id="password"
                        minlength="8"
                        required
                >

            </div>


            <!-- Phone -->

            <div class="form-group">

                <label for="phone">
                    Phone
                </label>

                <input
                        type="tel"
                        id="phone"
                >

            </div>


            <!-- Submit -->

            <button type="submit">
                Register
            </button>


            <!-- Error Message -->

            <p id="errorMessage"></p>

        </form>


        <p class="switch-auth">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>

    </div>

</div>


<script src="js/auth.js"></script>

</body>

</html>
