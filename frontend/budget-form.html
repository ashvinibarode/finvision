<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FinVision - Budget</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="dashboard">

    <aside class="sidebar">

        <h2>FinVision</h2>

        <nav>
            <a href="index.html">Dashboard</a>
            <a href="transactions.html">Transactions</a>
            <a href="budget.html">Budgets</a>
            <a href="reports.html">Reports</a>
            <a href="profile.html">Profile</a>
        </nav>

        <button id="logoutBtn">
            Logout
        </button>

    </aside>


    <main class="main-content">

        <header class="topbar">

            <div>
                <h1 id="formTitle">
                    Add Budget
                </h1>

                <p>
                    Set your monthly spending limit
                </p>
            </div>

        </header>


        <section class="transactions-card">

            <form id="budgetForm">

                <div class="form-group">

                    <label for="category">
                        Category
                    </label>

                    <select
                            id="category"
                            required
                    >
                        <option value="">
                            Select Category
                        </option>
                    </select>

                </div>


                <div class="form-group">

                    <label for="amount">
                        Budget Amount
                    </label>

                    <input
                            type="number"
                            id="amount"
                            min="0.01"
                            step="0.01"
                            required
                    >

                </div>


                <div class="form-group">

                    <label for="month">
                        Month
                    </label>

                    <input
                            type="month"
                            id="month"
                            required
                    >

                </div>


                <button
                        type="submit"
                        id="submitBtn"
                >
                    Save Budget
                </button>

                <button
                        type="button"
                        id="cancelBtn"
                >
                    Cancel
                </button>

                <p id="formMessage"></p>

            </form>

        </section>

    </main>

</div>

<script src="js/api.js"></script>
<script src="js/budget-form.js"></script>

</body>

</html>
